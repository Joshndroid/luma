#
# Cameras run in their own WirePlumber instance, wireplumber@video-capture
# (WirePlumber's "video-capture" profile, started with pipewire.service by
# /usr/lib/systemd/user/pipewire.service.d/50-luma-camera-instance.conf).
#
# The V4L2 and libcamera monitors load libcamera, its pipeline handlers and
# its software ISP into the WirePlumber process that hosts them. A fault there
# used to end the main instance, and with it every audio and Bluetooth device,
# stream link and client permission it owns. The main instance keeps policy,
# default nodes and client access (portal camera permissions included); it
# applies them to the camera nodes the other instance creates.
wireplumber.profiles = {
  main = {
    hardware.video-capture = disabled
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
  }
}
