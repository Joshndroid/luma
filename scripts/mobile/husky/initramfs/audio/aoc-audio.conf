# SPDX-License-Identifier: Apache-2.0
# Luma husky: Pixel 8 Pro built-in audio (AoC card), after Pixel 9's
# tokay profile. Native microphones; a bounded speaker route that only unmutes
# once the amplifiers' protection is calibrated (speaker-ready).
Syntax 6
Comment "Pixel 8 Pro built-in audio"
SectionUseCase."HiFi" {
 File "/aoc-audio/HiFi.conf"
 Comment "Built-in audio"
}
FixedBootSequence [
 cset "name='Digital PCM Volume' 0"
 cset "name='R Digital PCM Volume' 0"
]
