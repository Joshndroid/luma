# Luma husky: the AoC sound card's playback endpoint takes whatever is
# written into the AoC's own ring at once, so the ALSA pointer catches up
# with the write pointer as soon as the stream starts. PipeWire primes one
# period by default, reads that as an empty buffer and recovers from an
# underrun over and over (silence, about 24 restarts a second). Keeping
# 2048 frames (43 ms) queued ahead lets the stream run.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-aoc-sound.*" } ]
    actions = { update-props = { api.alsa.headroom = 2048 } }
  }
]
