# Luma husky, after Pixel 9's tokay HiFi.conf: the AoC's native
# capture endpoint and the speaker amps behind calibrated protection.
SectionVerb {
 EnableSequence []
 DisableSequence []
 Value { TQ "HiFi" }
}

SectionDevice."Mic" {
 Comment "Built-in microphones"
 # 13 dB preamp as on stock; the AoC's record soft gain boots at 0 dB, which
 # leaves speech some 20 dB too quiet. Stock uses 22 dB, which clipped
 # speech at arm's length here and lifted the hiss; 12 dB keeps headroom.
 EnableSequence [
  cset "name='Mic HW Gain (cB)' 130"
  cset "name='Mic Record Soft Gain (dB)' 12"
 ]
 DisableSequence [
  cset "name='Mic HW Gain (cB)' 0"
  cset "name='Mic Record Soft Gain (dB)' 0"
 ]
 Value {
  CapturePriority 100
  CapturePCM "hw:${CardId},1"
  CaptureChannels 2
 }
}

# Nothing at all unless speaker-ready passes: it checks that the amplifiers'
# protection is armed with this phone's calibration, then sets them to the
# phone's factory analog and digital volume (17 and 817, i.e. 0 dB digital,
# on the bench unit). The earlier fixed -18 dB digital / 0.5 dB analog cap
# played some 35 dB below that.
SectionDevice."Speaker" {
 Comment "Built-in speakers"
 EnableSequence [
  exec "/run/luma-husky-audio/speaker-ready"
 ]
 DisableSequence [
  cset "name='Digital PCM Volume' 0"
  cset "name='R Digital PCM Volume' 0"
 ]
 Value {
  PlaybackPriority 100
  PlaybackPCM "hw:${CardId},0"
  PlaybackChannels 2
 }
}
