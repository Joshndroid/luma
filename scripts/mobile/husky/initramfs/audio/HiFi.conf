# Luma husky, after Pixel 9's tokay HiFi.conf: the AoC's native
# capture endpoint and the speaker amps behind calibrated protection.
SectionVerb {
 EnableSequence []
 DisableSequence []
 Value { TQ "HiFi" }
}

SectionDevice."Mic" {
 Comment "Built-in microphones"
 EnableSequence [
  cset "name='Mic HW Gain (cB)' 130"
  cset "name='Mic Record Soft Gain (dB)' 0"
 ]
 DisableSequence [
  cset "name='Mic HW Gain (cB)' 0"
  cset "name='Mic Record Soft Gain (dB)' 0"
 ]
 Value {
  CapturePriority 100
  CapturePCM "hw:${CardId},1"
  CaptureChannels 2
 }
}

# Bounded playback, as on Pixel 9: -18 dB digital (673; 817 is 0 dB),
# 0.5 dB analog, and nothing at all unless speaker-ready passes.
SectionDevice."Speaker" {
 Comment "Built-in speakers"
 EnableSequence [
  exec "/run/luma-husky-audio/speaker-ready"
  cset "name='Analog PCM Volume' 0"
  cset "name='R Analog PCM Volume' 0"
  cset "name='Digital PCM Volume' 673"
  cset "name='R Digital PCM Volume' 673"
 ]
 DisableSequence [
  cset "name='Digital PCM Volume' 0"
  cset "name='R Digital PCM Volume' 0"
 ]
 Value {
  PlaybackPriority 100
  PlaybackPCM "hw:${CardId},0"
  PlaybackChannels 2
 }
}
