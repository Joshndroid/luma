# Boot policy for the Pixel 8 Pro. Format and page size come from
# socs/google/zuma/soc.toml.
schema = 1
partition = "boot"
partition_size = 67108864
os_version = "16.0.0"
os_patch_level = "2026-10-01"

[cmdline]
# Fixed arguments, in order. ABL's own command line lives in the DTB the
# kernel does not use, so the kernel forces its built-in one (CONFIG_CMDLINE,
# SimplyLuma/linux zuma luma/husky/alpha1/): these arguments, then the
# generated ones. scripts/mobile/husky/build-boot.sh refuses a kernel config
# whose CONFIG_CMDLINE differs.
args = [
  # A warm reset keeps RAM (ramoops) across restarts.
  "reboot=warm",
  "panic=0",
  "rdinit=/init",
  "loglevel=7",
  "printk.time=1",
  # Until the kernel models them all, clocks, power domains and regulators
  # it does not know stay as the bootloader left them.
  "clk_ignore_unused",
  "pd_ignore_unused",
  "regulator_ignore_unused",
  # MTE tag storage is not enabled by the firmware; Android sets this too.
  "arm64.nomte",
  "fbcon=font:TER16x32",
  # The bootloader's slot suffix never reaches the kernel: the OSTree aboot
  # link is always root.a.
  "androidboot.slot_suffix=_a",
  "systemd.show_status=1",
]
# The generic phone userdata image's filesystems (as build-device-kit.py
# checks) and ostree=aboot, which the initramfs replaces per deployment.
generated = ["pmos_root_uuid", "pmos_boot_uuid", "ostree"]
# Release images must keep SELinux enforcing; these may never appear.
forbidden = ["selinux=0", "enforcing=0", "lsm="]

[avb]
# husky's ABL refuses an image without an AVB hash footer, even unlocked, so
# the image carries one signed with the public AOSP test key (an integrity
# envelope, not verified boot). vbmeta stays as Google ships it.
footer = "hash"
algorithm = "SHA256_RSA4096"
hash_algorithm = "sha256"
rollback_index = 1791158400
vbmeta = "untouched"

[dtbo]
# The kernel uses its embedded DTB and ignores the one ABL assembles, so the
# stock overlays are left as Google ships them and never written.
policy = "stock"
partitions = ["dtbo_a", "dtbo_b"]
